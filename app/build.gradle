plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homecloud.shell'
    compileSdk 34

    defaultConfig {
        applicationId 'com.homecloud.shell'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No third-party dependency: the app only uses the Android framework.
